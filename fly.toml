# fly.io config for the keepertoll gateway.
# Deploy:
#   fly launch --no-deploy --copy-config         # create app, keep this fly.toml
#   fly volumes create keepertoll_data --size 1 --region ord
#   fly secrets set GATEWAY_ADMIN_TOKEN=$(openssl rand -hex 32)
#   fly deploy
#   # then set GATEWAY_PUBLIC_URL to whatever fly assigns:
#   fly secrets set GATEWAY_PUBLIC_URL=https://<app>.fly.dev
#   fly deploy

app = "keepertoll-gateway"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  GATEWAY_PORT = "3030"
  GATEWAY_REGISTRY_PATH = "/data/registry.json"
  GATEWAY_AUDIT_LOG_PATH = "/data/audit.log"
  X402_FACILITATOR_URL = "https://x402.org/facilitator"
  KEEPERHUB_API_BASE = "https://app.keeperhub.com/api"
  LOG_LEVEL = "info"

[[mounts]]
  source = "keepertoll_data"
  destination = "/data"

[http_service]
  internal_port = 3030
  force_https = true
  # Always-on so the demo never cold-starts. Bump min_machines_running if you
  # need redundancy.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.checks]
    [http_service.checks.healthz]
      grace_period = "5s"
      interval = "15s"
      method = "GET"
      timeout = "3s"
      path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
