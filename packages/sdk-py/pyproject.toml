[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keepertoll"
version = "0.1.0"
description = "Python SDK for calling x402-paid KeeperHub workflows. Companion to @keepertoll/client (TypeScript)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sachin Gurjar and the keepertoll authors" }]
keywords = ["keeperhub", "x402", "workflow", "agent", "payments", "usdc"]

[project.urls]
Homepage = "https://github.com/sachingurjar/keepertoll"
Repository = "https://github.com/sachingurjar/keepertoll"
Issues = "https://github.com/sachingurjar/keepertoll/issues"
Documentation = "https://github.com/sachingurjar/keepertoll/tree/main/packages/sdk-py#readme"
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "httpx>=0.27",
  "eth-account>=0.13",
  "web3>=6.20,<8",
  "x402>=2.9,<3",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.7.0",
  "pyright>=1.1.380",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "respx>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/keepertoll"]

[tool.hatch.build.targets.sdist]
include = ["src/keepertoll", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S101"]
# Example agents print colored output via long f-strings; strict line length
# fights readability for terminal text. Allow E501 + RUF003 (× in comments).
"examples/*" = ["ANN", "E501", "RUF003"]

[tool.pyright]
include = ["src", "tests", "examples"]
exclude = ["**/__pycache__", ".venv"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingImports = "error"
# Third-party deps (httpx, eth_account, x402) ship partial or no type stubs.
# Demote the unknown-* family to warnings so pyright still catches genuine
# strict-mode issues in our own code while letting library leaks through.
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownParameterType = "warning"
reportUnknownLambdaType = "warning"
reportMissingTypeStubs = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: spins up the local node gateway; requires KEEPERTOLL_INTEGRATION=1",
]
