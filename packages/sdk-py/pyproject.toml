[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keepertoll"
version = "0.0.0"
description = "Python SDK for calling x402-paid KeeperHub workflows. Companion to the keeperhub-publish CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "keepertoll authors" }]
keywords = ["keeperhub", "x402", "workflow", "agent", "payments"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff>=0.7.0",
  "pyright>=1.1.380",
  "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/keepertoll"]

[tool.hatch.build.targets.sdist]
include = ["src/keepertoll", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__", ".venv"]
strict = ["src/keepertoll"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportMissingImports = "error"
reportUnknownMemberType = "warning"
